<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>中式四角对称祥云回纹边框</title>
  <desc>透明背景，四角各有独立小正方形和两片相连的方形祥云回纹，边线对称。</desc>
  <!--
    Adapted for the award tags (background-size 100% 100%): the hand-drawn
    960×400 layout is rebased at scale ≈ 0.093 into fixed 18×15px corner
    cells so the meander cluster keeps its drawn shape on any tag, while the
    running rules are percentage rects spanning the full edge. A luminance
    mask cuts the rules short of each corner cluster — the asset itself is
    fully transparent outside the strokes.
  -->
  <defs>
    <!-- corner blocker used by the mask to gap the rules -->
    <rect id="block" width="13.5" height="14.5" fill="#000"/>
    <g id="corner" fill="none" stroke="#96703b" stroke-width="0.7" stroke-linecap="square" stroke-linejoin="miter">
      <!-- independent square at the outermost corner -->
      <rect x="3.16" y="4" width="3.3" height="3.3"/>
      <!-- paired linked square-cloud scrolls, upper-right and lower-left -->
      <path d="M7.72 8.46V4H12.09V8.46H9.49V5.86H10.79"/>
      <path d="M7.72 8.46H3.16V13.02H7.63V10.32H4.93V11.71"/>
    </g>
    <mask id="rule-gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="#fff"/>
      <use href="#block"/>
      <svg x="100%" width="18" height="15" overflow="visible"><use href="#block" transform="scale(-1 1)"/></svg>
      <svg x="100%" y="100%" width="18" height="15" overflow="visible"><use href="#block" transform="scale(-1 -1)"/></svg>
      <svg y="100%" width="18" height="15" overflow="visible"><use href="#block" transform="scale(1 -1)"/></svg>
    </mask>
  </defs>

  <!-- running rules, full length; the mask opens the corner gaps -->
  <g fill="#96703b" mask="url(#rule-gaps)">
    <rect x="0" y="3.65" width="100%" height="0.7"/>
    <rect x="2.81" y="0" width="0.7" height="100%"/>
    <svg x="0" y="100%" width="100%" height="15" overflow="visible">
      <rect x="0" y="-4.35" width="100%" height="0.7"/>
    </svg>
    <svg x="100%" y="0" width="15" height="100%" overflow="visible">
      <rect x="-3.51" y="0" width="0.7" height="100%"/>
    </svg>
  </g>

  <use href="#corner"/>
  <svg x="100%" width="18" height="15" overflow="visible"><use href="#corner" transform="scale(-1 1)"/></svg>
  <svg x="100%" y="100%" width="18" height="15" overflow="visible"><use href="#corner" transform="scale(-1 -1)"/></svg>
  <svg y="100%" width="18" height="15" overflow="visible"><use href="#corner" transform="scale(1 -1)"/></svg>
</svg>
